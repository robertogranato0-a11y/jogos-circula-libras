<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz dos dias da semana · Libras</title>
<meta name="description" content="Quiz dos dias da semana: jogo da Aula 14 do Curso de Libras do Instituto Circula Libras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Layout: coluna central — cabeçalho, tela inicial, pergunta (figura, sinal soletrado ou texto) com 4 opções, resultado com tabela */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --roxo-bg: #f4eef9; --amarelo: #ffcc33; --linha: #ddd3e8; --logo-bg: transparent;
  --certo: #1f8a4c; --certo-bg: #e3f4ea; --errado: #c0392b; --errado-bg: #fbe6e3;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --roxo-bg: #2c2040; --linha: #3a2c4c; --logo-bg: #ffffff;
    --certo: #5fd08f; --certo-bg: #173a27; --errado: #ff8a7a; --errado-bg: #45201b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
.cartao { background: var(--surface); border: 1.5px solid var(--linha); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.tipo { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.msg { margin: 0; line-height: 1.5; }
.progresso { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 8px; background: var(--linha); border-radius: 99px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--roxo); transition: width .3s; }
.enunciado { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 0; }
.dica { font-size: 13px; color: var(--roxo); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.figura { align-self: center; width: min(280px, 78vw); aspect-ratio: 1; background: #fff; border: 2px solid var(--linha); border-radius: 16px; padding: 8px; display: grid; place-items: center; }
.figura img { max-width: 100%; max-height: 100%; object-fit: contain; }
.palavra { align-self: center; font-family: var(--display); color: var(--roxo); font-size: clamp(32px, 9vw, 46px); line-height: 1.1; text-align: center; }
.soletra { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.soletra .mao { width: min(200px, 56vw); aspect-ratio: 1; background: #fff; border: 2px solid var(--linha); border-radius: 16px; display: grid; place-items: center; padding: 8px; }
.soletra .mao img { max-width: 100%; max-height: 100%; }
.soletra .pontos { display: flex; gap: 6px; }
.soletra .pontos i { width: 10px; height: 10px; border-radius: 50%; background: var(--linha); }
.soletra .pontos i.on { background: var(--roxo); }
.tira { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tira figure { margin: 0; width: 56px; text-align: center; }
.tira img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--linha); }
.tira figcaption { font-size: 12px; font-weight: 700; color: var(--muted); }
.vel { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button.sec { font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; }
button.sec[aria-pressed="true"] { background: var(--roxo); color: #fff; }
.ops { display: flex; flex-direction: column; gap: 10px; }
.ops.imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.op { font: 600 16px var(--body); text-align: left; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--linha); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.op .l { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--roxo-bg); color: var(--roxo); }
.ops.imgs .op { flex-direction: column; padding: 8px; background: #fff; }
.ops.imgs .op img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.ops.imgs .op .l { align-self: flex-start; margin-bottom: -26px; position: relative; z-index: 1; }
.op:hover:not(:disabled) { border-color: var(--roxo-claro); }
.op:disabled { cursor: default; }
.op.certa { border-color: var(--certo); background: var(--certo-bg); }
.op.errada { border-color: var(--errado); background: var(--errado-bg); }
.op:focus-visible, button.sec:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.feedback { margin: 0; line-height: 1.45; }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.ok b { color: var(--certo); } .feedback.nao b { color: var(--errado); }
button.acao { font: 700 15px var(--body); padding: 12px 20px; border-radius: 999px; border: 0; background: var(--amarelo); color: #2a1740; cursor: pointer; align-self: flex-end; }
button.acao.centro { align-self: center; }
button.acao:focus-visible { outline: 3px solid var(--roxo); outline-offset: 2px; }
.placar { font-family: var(--display); color: var(--roxo); font-size: clamp(44px, 12vw, 64px); line-height: 1; }
.tabela-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.r { font-weight: 700; white-space: nowrap; }
td.r.ok { color: var(--certo); } td.r.nao { color: var(--errado); }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
</style>
</head>

// CFG: instr, qtd (máx. de perguntas por partida), fim
// ITENS: [{k, n, g?}] → perguntas automáticas "qual é este sinal?" e "onde está o sinal?" (IMG[k])
// PERGUNTAS: extras fixas: {t:"texto", q, ops:[certa, ...], exp} ou {t:"soletrado", w}
const $ = id => document.getElementById(id);
const embaralhar = a => { a = [...a]; for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PALAVRAS_SOLETRADAS = (typeof PALAVRAS !== "undefined") ? PALAVRAS : [];
let lista = [], i = 0, acertos = 0, respostas = [], timerSol = null, velSol = 1100;

function montar() {
  let q = [];
  ITENS.forEach((it, n) => q.push({ t: n % 2 ? "qualSinal" : "sinal", it }));
  q = embaralhar(q).map((p, n) => ({ ...p, t: ITENS.length < 4 ? "sinal" : p.t }));
  (typeof PERGUNTAS !== "undefined" ? PERGUNTAS : []).forEach(p => q.push(p));
  PALAVRAS_SOLETRADAS.forEach(w => q.push({ t: "soletrado", w }));
  q = embaralhar(q);
  return CFG.qtd ? q.slice(0, CFG.qtd) : q;
}

function distratores(it, n) {
  const mesmo = ITENS.filter(x => x !== it && (x.g || "") === (it.g || "") && x.n !== it.n);
  const outros = ITENS.filter(x => x !== it && !mesmo.includes(x) && x.n !== it.n);
  return [...embaralhar(mesmo), ...embaralhar(outros)].slice(0, n);
}

function botao(conteudo, valor, k, img) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "op"; b.dataset.v = valor;
  b.innerHTML = `<span class="l">${"ABCD"[k]}</span>` + conteudo;
  b.addEventListener("click", () => responder(valor));
  return b;
}

function mostrar() {
  const p = lista[i];
  clearInterval(timerSol);
  $("num").textContent = `Pergunta ${i + 1} de ${lista.length}`;
  $("acertos").textContent = `${acertos} ${acertos === 1 ? "acerto" : "acertos"}`;
  $("barra").style.width = (i / lista.length * 100) + "%";
  $("feedback").innerHTML = ""; $("feedback").className = "feedback"; $("proxima").hidden = true;
  $("ops").className = "ops"; $("ops").innerHTML = ""; $("estimulo").innerHTML = ""; $("dica").hidden = true;
  if (p.t === "sinal") {
    $("tipo").textContent = "Veja o sinal"; $("enunciado").textContent = "Qual é este sinal?";
    if (p.it.g) { $("dica").textContent = p.it.g; $("dica").hidden = false; }
    $("estimulo").innerHTML = `<div class="figura" style="margin:0 auto"><img src="${IMG[p.it.k]}" alt="Sinal em Libras para adivinhar"></div>`;
    p.certa = p.it.n;
    embaralhar([p.it, ...distratores(p.it, 3)]).forEach((x, k) => {
      const b = botao("<span></span>", x.n, k); b.lastChild.textContent = x.n; $("ops").appendChild(b);
    });
  } else if (p.t === "qualSinal") {
    $("tipo").textContent = "Encontre o sinal"; $("enunciado").textContent = "Onde está o sinal de:";
    $("estimulo").innerHTML = `<div class="palavra"></div>`; $("estimulo").firstChild.textContent = p.it.n;
    if (p.it.g) { $("dica").textContent = p.it.g; $("dica").hidden = false; }
    p.certa = p.it.n; $("ops").className = "ops imgs";
    embaralhar([p.it, ...distratores(p.it, 3)]).forEach((x, k) => {
      $("ops").appendChild(botao(`<img src="${IMG[x.k]}" alt="Opção ${"ABCD"[k]}">`, x.n, k));
    });
  } else if (p.t === "soletrado") {
    $("tipo").textContent = "Leia a datilologia"; $("enunciado").textContent = "Que palavra foi soletrada?";
    p.certa = p.w;
    $("estimulo").innerHTML = `<div class="soletra"><div class="mao"><img id="maoImg" alt="Letra em Libras"></div><div class="pontos" id="pontos"></div>
      <div class="vel"><button class="sec" type="button" id="deNovo">↻ Ver de novo</button><button class="sec" type="button" id="maisDevagar" aria-pressed="false">Mais devagar</button></div></div>`;
    $("pontos").innerHTML = [...p.w].map(() => "<i></i>").join("");
    $("deNovo").addEventListener("click", () => soletrar(p.w));
    $("maisDevagar").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); velSol = on ? 1800 : 1100; soletrar(p.w); });
    soletrar(p.w);
    const outras = embaralhar(PALAVRAS_SOLETRADAS.filter(w => w !== p.w)).sort((a, b) => Math.abs(a.length - p.w.length) - Math.abs(b.length - p.w.length)).slice(0, 3);
    embaralhar([p.w, ...outras]).forEach((w, k) => { const b = botao("<span></span>", w, k); b.lastChild.textContent = w; $("ops").appendChild(b); });
  } else {
    $("tipo").textContent = p.tipo || "Pergunta"; $("enunciado").textContent = p.q; p.certa = p.ops[0];
    embaralhar(p.ops).forEach((v, k) => { const b = botao("<span></span>", v, k); b.lastChild.textContent = v; $("ops").appendChild(b); });
  }
}

function soletrar(w) {
  clearInterval(timerSol);
  const letras = [...w], pts = $("pontos").children; let n = 0;
  const passo = () => {
    if (n >= letras.length) { clearInterval(timerSol); return; }
    $("maoImg").src = LETRAS[letras[n]]; [...pts].forEach((x, k) => x.classList.toggle("on", k === n)); n++;
  };
  passo(); timerSol = setInterval(passo, velSol);
}

function responder(v) {
  const p = lista[i], ok = v === p.certa;
  if (ok) acertos++;
  clearInterval(timerSol);
  respostas.push({ q: p.t === "sinal" ? "Qual é este sinal?" : p.t === "qualSinal" ? "Sinal de " + p.it.n : p.t === "soletrado" ? "Datilologia" : p.q, v, c: p.certa, ok });
  [...$("ops").children].forEach(b => {
    b.disabled = true;
    if (b.dataset.v === p.certa) b.classList.add("certa"); else if (b.dataset.v === v) b.classList.add("errada");
  });
  let exp = p.exp || "";
  if (p.t === "soletrado") {
    exp = "";
    $("estimulo").innerHTML = `<div class="tira">${[...p.w].map(l => `<figure><img src="${LETRAS[l]}" alt="Letra ${l}"><figcaption>${l}</figcaption></figure>`).join("")}</div>`;
  }
  if (p.t === "sinal" || p.t === "qualSinal") exp = "Faça o sinal de " + p.certa + " com a sua mão antes de seguir.";
  $("feedback").className = "feedback " + (ok ? "ok" : "nao");
  $("feedback").innerHTML = `<b></b><span></span>`;
  $("feedback").firstChild.textContent = ok ? "Acertou!" : "Não foi dessa vez. Resposta: " + p.certa + ".";
  $("feedback").lastChild.textContent = exp;
  $("acertos").textContent = `${acertos} ${acertos === 1 ? "acerto" : "acertos"}`;
  $("proxima").textContent = i === lista.length - 1 ? "Ver resultado →" : "Próxima →";
  $("proxima").hidden = false; $("proxima").focus();
}

function proxima() { i++; if (i < lista.length) mostrar(); else fim(); }

function fim() {
  $("telaQuiz").hidden = true; $("telaFim").hidden = false;
  $("placar").textContent = `${acertos} de ${lista.length}`;
  const pct = acertos / lista.length;
  $("msg").textContent = pct === 1 ? "Perfeito! Você acertou todas. " + (CFG.fim || "")
    : pct >= .7 ? "Muito bem! Revise as que errou e jogue de novo para chegar a 100%."
    : "Continue praticando. Reveja a videoaula e a apostila e tente de novo.";
  $("tabela").innerHTML = respostas.map((r, k) => `<tr><td>${k + 1}</td><td>${esc(r.q)}</td><td>${esc(r.v)}</td><td>${esc(r.c)}</td><td class="r ${r.ok ? "ok" : "nao"}">${r.ok ? "✔ certo" : "✘ errado"}</td></tr>`).join("");
  window.scrollTo(0, 0);
}

function iniciar() {
  lista = montar(); i = 0; acertos = 0; respostas = [];
  $("telaInicio").hidden = true; $("telaFim").hidden = true; $("telaQuiz").hidden = false;
  mostrar(); window.scrollTo(0, 0);
}
$("instr").textContent = CFG.instr;
$("comecar").addEventListener("click", iniciar);
$("refazer").addEventListener("click", iniciar);
$("proxima").addEventListener("click", proxima);
</script>
</body>
</html>
