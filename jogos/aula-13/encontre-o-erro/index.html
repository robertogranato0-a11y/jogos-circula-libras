<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encontre o erro · Libras</title>
<meta name="description" content="Encontre o erro: jogo da Aula 13 do Curso de Libras do Instituto Circula Libras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho; placa "Encontre o erro"; grade 2x2 de cartões (cena em cima, sinal embaixo); resultado */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --roxo-bg: #f4eef9; --amarelo: #ffcc33; --linha: #ddd3e8; --logo-bg: transparent;
  --certo: #1f8a4c; --certo-bg: #e3f4ea; --errado: #c0392b; --errado-bg: #fbe6e3;
  --mesa: #2f7a5a; --mesa-borda: #245f46;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --roxo-bg: #2c2040; --linha: #3a2c4c; --logo-bg: #ffffff;
    --certo: #5fd08f; --certo-bg: #173a27; --errado: #ff8a7a; --errado-bg: #45201b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--display); color: var(--roxo); font-size: 24px; margin: 0; line-height: 1.15; }
.instr { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.cartao { background: var(--surface); border: 1.5px solid var(--linha); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.tipo { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.msg { margin: 0; line-height: 1.5; }
.progresso { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 8px; background: var(--linha); border-radius: 99px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--roxo); transition: width .3s; }
.feedback { margin: 0; line-height: 1.45; min-height: 1.4em; }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.ok b { color: var(--certo); } .feedback.nao b { color: var(--errado); }
button.acao { font: 700 15px var(--body); padding: 12px 20px; border-radius: 999px; border: 0; background: var(--amarelo); color: #2a1740; cursor: pointer; align-self: flex-end; }
button.acao.centro { align-self: center; }
button.acao:disabled { opacity: .5; cursor: default; }
button.sec { font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; }
button.sec[aria-pressed="true"] { background: var(--roxo); color: #fff; }
button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.placar { font-family: var(--display); color: var(--roxo); font-size: clamp(44px, 12vw, 64px); line-height: 1; }
.festa { padding: 18px; border-radius: 16px; background: var(--roxo); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.festa h2 { color: var(--amarelo); }
.festa p { margin: 0; line-height: 1.5; }
.festa button.acao { align-self: flex-start; }
.sinal-img { background: #fff; border-radius: 12px; border: 1.5px solid var(--linha); display: grid; place-items: center; overflow: hidden; }
.sinal-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
@keyframes balanca { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
.balanca { animation: balanca .4s; }
@keyframes pulo { 0% { transform: scale(1) } 50% { transform: scale(1.08) } 100% { transform: scale(1) } }
.pulo { animation: pulo .35s; }
@media (prefers-reduced-motion: reduce) { .balanca, .pulo { animation: none; } }

.placa { background: var(--roxo); color: #fff; border-radius: 14px; padding: 12px 16px; text-align: center; font: 700 clamp(20px, 5vw, 28px) var(--display); letter-spacing: .02em; }
.placa small { display: block; font: 600 13px var(--body); color: var(--amarelo); margin-top: 2px; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.carta { border: 2.5px solid var(--linha); background: var(--surface); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; font: inherit; color: inherit; text-align: center; transition: transform .12s, border-color .12s; }
.carta:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--roxo-claro); }
.carta:disabled { cursor: default; }
.carta.certa { border-color: var(--certo); background: var(--certo-bg); }
.carta.errada { border-color: var(--errado); background: var(--errado-bg); }
.cena { height: 76px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .04em; gap: 2px; }
.cena .emoji { font-size: 44px; line-height: 1; }
.cena.cor { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); border: 1px solid rgba(0,0,0,.15); }
.cena.texto { background: var(--roxo-bg); color: var(--roxo); font-family: var(--display); font-size: clamp(18px, 4.5vw, 24px); }
.carta .sinal-img { aspect-ratio: 1; }
.carta .nomeSinal { font-size: 12px; font-weight: 700; color: var(--muted); min-height: 15px; }
</style>
</head>

// CFG: instr, rodadas · ITENS: [{k, n, e?(emoji), c?(cor)}] · IMG[k]
const $ = id => document.getElementById(id);
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let rodadas = [], r = 0, acertos = 0, errados = [];

function cena(it) {
  const d = document.createElement("div");
  if (it.c) { d.className = "cena cor"; d.style.background = it.c; d.textContent = it.n; }
  else if (it.e) { d.className = "cena"; d.innerHTML = `<span class="emoji" aria-hidden="true">${it.e}</span><span></span>`; d.lastChild.textContent = it.n; }
  else { d.className = "cena texto"; d.textContent = it.n; }
  return d;
}

function montar() {
  const n = Math.min(CFG.rodadas || 12, ITENS.length);
  return embaralhar(ITENS).slice(0, n).map(alvo => {
    const outros = embaralhar(ITENS.filter(x => x !== alvo)).slice(0, 3);
    const trocado = embaralhar(ITENS.filter(x => x !== alvo && !outros.includes(x)))[0] || outros[0];
    return { cartas: embaralhar([{ it: alvo, sinal: trocado, erro: true }, ...outros.map(o => ({ it: o, sinal: o, erro: false }))]) };
  });
}

function mostrar() {
  const R = rodadas[r];
  $("num").textContent = `Rodada ${r + 1} de ${rodadas.length}`;
  $("acertos").textContent = `${acertos} ${acertos === 1 ? "acerto" : "acertos"}`;
  $("barra").style.width = (r / rodadas.length * 100) + "%";
  $("feedback").textContent = ""; $("feedback").className = "feedback"; $("proxima").hidden = true;
  $("grade").innerHTML = "";
  R.cartas.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "carta";
    b.appendChild(cena(c.it));
    const s = document.createElement("div"); s.className = "sinal-img"; s.innerHTML = `<img src="${IMG[c.sinal.k]}" alt="Sinal em Libras">`; b.appendChild(s);
    const nm = document.createElement("span"); nm.className = "nomeSinal"; b.appendChild(nm);
    b.setAttribute("aria-label", `Cartão ${i + 1}: ${c.it.n}`);
    b.addEventListener("click", () => escolher(i));
    $("grade").appendChild(b);
  });
}

function escolher(i) {
  const R = rodadas[r], cs = [...$("grade").children], c = R.cartas[i], ok = c.erro;
  if (ok) acertos++; else errados.push(R.cartas.find(x => x.erro));
  cs.forEach((b, k) => { b.disabled = true; const x = R.cartas[k];
    if (x.erro) { b.classList.add(ok ? "certa" : "errada"); b.querySelector(".nomeSinal").textContent = "Este é o sinal de " + x.sinal.n; }
    else if (k === i) b.classList.add("errada"); });
  const e = R.cartas.find(x => x.erro);
  $("feedback").className = "feedback " + (ok ? "ok" : "nao");
  $("feedback").innerHTML = `<b>${ok ? "Achou o erro!" : "Não foi esse."}</b><span></span>`;
  $("feedback").lastChild.textContent = `A figura é ${e.it.n}, mas o sinal mostrado é ${e.sinal.n}. Faça o sinal certo de ${e.it.n}.`;
  $("acertos").textContent = `${acertos} ${acertos === 1 ? "acerto" : "acertos"}`;
  $("proxima").textContent = r === rodadas.length - 1 ? "Ver resultado →" : "Próxima →";
  $("proxima").hidden = false; $("proxima").focus();
}

function fim() {
  $("telaJogo").hidden = true; $("festa").hidden = false;
  $("placar").textContent = `${acertos} de ${rodadas.length}`;
  $("festaP").textContent = acertos === rodadas.length ? "Você encontrou todos os erros. Olho de águia!"
    : "Revise estes sinais: " + [...new Set(errados.map(x => x.it.n))].join(", ") + ".";
  window.scrollTo(0, 0);
}

function iniciar() { rodadas = montar(); r = 0; acertos = 0; errados = []; $("telaJogo").hidden = false; $("festa").hidden = true; mostrar(); }
$("instr").textContent = CFG.instr;
$("proxima").addEventListener("click", () => { r++; r < rodadas.length ? mostrar() : fim(); });
$("denovo").addEventListener("click", iniciar);
iniciar();
</script>
