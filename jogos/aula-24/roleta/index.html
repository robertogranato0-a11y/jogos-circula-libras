<style>
/* Layout: coluna central — cabeçalho, escolha do modo, roleta com ponteiro no topo, cartão de resultado com conferência e placar */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --amarelo: #ffcc33; --linha: #ddd3e8; --logo-bg: transparent;
  --certo: #1f8a4c; --errado: #c0392b;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --linha: #3a2c4c; --logo-bg: #ffffff; --certo: #5fd08f; --errado: #ff8a7a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
.instr { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.modos { display: flex; gap: 8px; flex-wrap: wrap; }
.palco { position: relative; width: min(100%, 420px); margin: 8px auto 0; aspect-ratio: 1; }
.ponteiro { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 30px solid var(--amarelo); z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
#roda { width: 100%; height: 100%; transition: transform 4.2s cubic-bezier(.17,.67,.12,1); }
.centro { position: absolute; inset: 0; margin: auto; width: 24%; height: 24%; border-radius: 50%; border: 0; background: var(--amarelo); color: #2a1740; font: 700 clamp(14px, 4vw, 18px) var(--body); cursor: pointer; box-shadow: 0 0 0 6px #fff, 0 4px 10px rgba(0,0,0,.2); z-index: 3; }
.centro:disabled { cursor: default; opacity: .8; }
.centro:focus-visible { outline: 3px solid var(--roxo); outline-offset: 4px; }
.resultado { background: var(--surface); border: 1.5px solid var(--linha); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.resultado .rot { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.resultado .nome { font-family: var(--display); color: var(--roxo); font-size: clamp(32px, 9vw, 46px); line-height: 1.05; }
.resultado p { margin: 0; line-height: 1.5; }
.botoes { display: flex; gap: 10px; flex-wrap: wrap; }
button.sec { font: 600 14px var(--body); padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; }
button.sec[aria-pressed="true"] { background: var(--roxo); color: #fff; }
button.sec.ok { border-color: var(--certo); color: var(--certo); }
button.sec.nao { border-color: var(--errado); color: var(--errado); }
button.sec:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.sinal img { width: 220px; max-width: 100%; background: #fff; border-radius: 12px; border: 1px solid var(--linha); padding: 6px; }
.letras { display: flex; flex-wrap: wrap; gap: 6px; }
.letras figure { margin: 0; width: 56px; text-align: center; }
.letras img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--linha); }
.letras figcaption { font-size: 12px; font-weight: 700; color: var(--muted); }
.feitos { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.5; }
.pontos { font-weight: 700; font-variant-numeric: tabular-nums; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
@media (prefers-reduced-motion: reduce) { #roda { transition-duration: .01s; } }
</style>

const CORES = ["#662d91", "#8752b5", "#4e2170", "#a07cc5"];
const N = ITENS.length, FATIA = 360 / N;
let giro = 0, girando = false, sorteados = [], modo = "palavra", atual = null, acertos = 0, treinar = [];
const $ = id => document.getElementById(id);

function desenhar() {
  const ns = "http://www.w3.org/2000/svg", r = 196, svg = $("roda");
  svg.innerHTML = "";
  ITENS.forEach((it, i) => {
    const a0 = (i * FATIA - 90 - FATIA / 2) * Math.PI / 180, a1 = ((i + 1) * FATIA - 90 - FATIA / 2) * Math.PI / 180;
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", `M0 0 L${r * Math.cos(a0)} ${r * Math.sin(a0)} A${r} ${r} 0 0 1 ${r * Math.cos(a1)} ${r * Math.sin(a1)} Z`);
    p.setAttribute("fill", CORES[i % CORES.length]); p.setAttribute("stroke", "#ffffff"); p.setAttribute("stroke-width", "2");
    svg.appendChild(p);
    const t = document.createElementNS(ns, "text");
    const txt = modo === "palavra" ? it.n : String(i + 1);
    // texto na direção do raio, para caber muitas fatias
    t.setAttribute("transform", `rotate(${i * FATIA}) translate(0 -${modo === "palavra" ? 122 : 150}) rotate(${modo === "palavra" ? 90 : 0})`);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("fill", i % 2 ? "#ffffff" : "#ffcc33");
    t.setAttribute("font-family", "Montserrat, sans-serif"); t.setAttribute("font-weight", "700");
    t.setAttribute("font-size", modo === "palavra" ? (txt.length > 10 ? 12 : txt.length > 7 ? 14 : N > 12 ? 15 : 17) : 22);
    t.textContent = txt;
    svg.appendChild(t);
  });
  const borda = document.createElementNS(ns, "circle");
  borda.setAttribute("r", r); borda.setAttribute("fill", "none"); borda.setAttribute("stroke", "#ffcc33"); borda.setAttribute("stroke-width", "6");
  svg.appendChild(borda);
  svg.setAttribute("aria-label", `Roleta com ${N} sinais`);
}

function girar() {
  if (girando) return;
  let livres = ITENS.map((x, i) => i).filter(i => !sorteados.includes(i));
  if (!livres.length) { sorteados = []; livres = ITENS.map((x, i) => i); }
  const alvo = livres[Math.floor(Math.random() * livres.length)];
  const agora = ((giro % 360) + 360) % 360;
  const destino = (360 - alvo * FATIA) % 360;
  const jitter = (Math.random() - .5) * FATIA * .6;
  giro += 360 * 5 + ((destino - agora + 360) % 360) + jitter;

  $("roda").style.transform = `rotate(${giro}deg)`;

function mostrar(i) {
  girando = false; $("girar").disabled = false;
  sorteados.push(i); atual = ITENS[i];
  $("sinal").innerHTML = `<img src="${IMG[atual.k]}" alt="Sinal de ${atual.n} em Libras">`;
  if (modo === "palavra") {
    $("rot").textContent = "Faça o sinal de"; $("nome").textContent = atual.n; $("nome").hidden = false;
    $("sinal").hidden = true; $("btVer").textContent = "Conferir o sinal";
  } else {
    $("rot").textContent = "Que sinal é este? Diga ou escreva a palavra"; $("nome").textContent = atual.n; $("nome").hidden = true;
    $("sinal").hidden = false; $("btVer").textContent = "Ver a resposta";
  }
  $("btVer").hidden = false; $("auto").hidden = true;
  if (typeof LETRAS !== "undefined") {
    const lt = atual.n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]/g, "");
    $("letras").innerHTML = [...lt].map(l => `<figure><img src="${LETRAS[l]}" alt="Letra ${l} em Libras"><figcaption>${l}</figcaption></figure>`).join("");
    $("letras").hidden = true; $("btLetras").hidden = false; $("btLetras").setAttribute("aria-pressed", "false");
  }
  $("resultado").hidden = false;
  $("feitos").textContent = `Já sorteados (${sorteados.length} de ${N}): ` + sorteados.map(k => ITENS[k].n).join(", ");
}

function conferir() {
  $("sinal").hidden = false; $("nome").hidden = false; $("btVer").hidden = true; $("auto").hidden = false; $("btAcertei").focus();
}
function avaliar(ok) {
  if (ok) acertos++; else if (!treinar.includes(atual.n)) treinar.push(atual.n);
  $("auto").hidden = true;
  $("pontos").textContent = `Acertos: ${acertos}` + (treinar.length ? ` · Para treinar: ${treinar.join(", ")}` : "");
  $("girar").focus();
}
function trocarModo(m) {
  modo = m; $("mPalavra").setAttribute("aria-pressed", m === "palavra"); $("mSinal").setAttribute("aria-pressed", m === "sinal");
  $("resultado").hidden = true; desenhar();
}

$("instr").textContent = CFG.instr;
desenhar();
$("girar").addEventListener("click", girar);
$("btVer").addEventListener("click", conferir);
$("btAcertei").addEventListener("click", () => avaliar(true));
$("btTreinar").addEventListener("click", () => avaliar(false));
$("mPalavra").addEventListener("click", () => trocarModo("palavra"));
$("mSinal").addEventListener("click", () => trocarModo("sinal"));
$("btLetras").addEventListener("click", () => { const on = $("btLetras").getAttribute("aria-pressed") !== "true"; $("btLetras").setAttribute("aria-pressed", on); $("letras").hidden = !on; });
</script>
</body>
</html>
