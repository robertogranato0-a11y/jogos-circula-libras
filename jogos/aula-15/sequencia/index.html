<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Os meses em ordem · Libras</title>
<meta name="description" content="Os meses em ordem: jogo da Aula 15 do Curso de Libras do Instituto Circula Libras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho; trilha numerada que vai sendo preenchida; sinais embaralhados em grade; mensagem final */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --roxo-bg: #f4eef9; --amarelo: #ffcc33; --linha: #ddd3e8; --logo-bg: transparent;
  --certo: #1f8a4c; --certo-bg: #e3f4ea; --errado: #c0392b; --errado-bg: #fbe6e3;
  --mesa: #2f7a5a; --mesa-borda: #245f46;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --roxo-bg: #2c2040; --linha: #3a2c4c; --logo-bg: #ffffff;
    --certo: #5fd08f; --certo-bg: #173a27; --errado: #ff8a7a; --errado-bg: #45201b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--display); color: var(--roxo); font-size: 24px; margin: 0; line-height: 1.15; }
.instr { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.cartao { background: var(--surface); border: 1.5px solid var(--linha); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.tipo { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.msg { margin: 0; line-height: 1.5; }
.progresso { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 8px; background: var(--linha); border-radius: 99px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--roxo); transition: width .3s; }
.feedback { margin: 0; line-height: 1.45; min-height: 1.4em; }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.ok b { color: var(--certo); } .feedback.nao b { color: var(--errado); }
button.acao { font: 700 15px var(--body); padding: 12px 20px; border-radius: 999px; border: 0; background: var(--amarelo); color: #2a1740; cursor: pointer; align-self: flex-end; }
button.acao.centro { align-self: center; }
button.acao:disabled { opacity: .5; cursor: default; }
button.sec { font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; }
button.sec[aria-pressed="true"] { background: var(--roxo); color: #fff; }
button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.placar { font-family: var(--display); color: var(--roxo); font-size: clamp(44px, 12vw, 64px); line-height: 1; }
.festa { padding: 18px; border-radius: 16px; background: var(--roxo); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.festa h2 { color: var(--amarelo); }
.festa p { margin: 0; line-height: 1.5; }
.festa button.acao { align-self: flex-start; }
.sinal-img { background: #fff; border-radius: 12px; border: 1.5px solid var(--linha); display: grid; place-items: center; overflow: hidden; }
.sinal-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
@keyframes balanca { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
.balanca { animation: balanca .4s; }
@keyframes pulo { 0% { transform: scale(1) } 50% { transform: scale(1.08) } 100% { transform: scale(1) } }
.pulo { animation: pulo .35s; }
@media (prefers-reduced-motion: reduce) { .balanca, .pulo { animation: none; } }

.painel { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.trilha { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; padding: 10px; border-radius: 16px; background: var(--roxo); }
.vaga { border-radius: 12px; border: 2px dashed rgba(255,255,255,.5); min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; color: #fff; font-weight: 700; padding: 4px; gap: 4px; }
.vaga .n { font-size: 22px; color: var(--amarelo); font-family: var(--display); }
.vaga.cheia { border-style: solid; border-color: var(--amarelo); background: #fff; color: #2a1740; }
.vaga img { width: 100%; height: 80px; object-fit: contain; }
.vaga .nome { font-size: 11px; text-align: center; line-height: 1.15; }
.monte { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.monte button { aspect-ratio: 1; border-radius: 14px; border: 2.5px solid var(--linha); background: #fff; padding: 6px; cursor: pointer; transition: transform .12s, opacity .2s; }
.monte button:hover { transform: translateY(-2px); border-color: var(--roxo-claro); }
.monte button img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.monte button.usado { visibility: hidden; }
</style>
</head>

// CFG: instr, fim · ITENS na ordem certa: [{k, n}]
const $ = id => document.getElementById(id);
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let prox = 0, erros = 0, dicas = 0, inicio = 0, timer = null;

function iniciar() {
  prox = 0; erros = 0; dicas = 0; inicio = 0; clearInterval(timer); $("tempo").textContent = "0 s"; $("festa").hidden = true; $("feedback").textContent = "";
  $("trilha").innerHTML = ITENS.map((_, i) => `<div class="vaga"><span class="n">${i + 1}</span></div>`).join("");
  $("monte").innerHTML = "";
  embaralhar(ITENS.map((it, i) => ({ it, i }))).forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.i = o.i;
    b.innerHTML = `<img src="${IMG[o.it.k]}" alt="Sinal em Libras">`;
    b.addEventListener("click", () => tocar(b, o));
    $("monte").appendChild(b);
  });
  placar();
}
function placar() { $("cont").textContent = `${prox} de ${ITENS.length} · ${erros} ${erros === 1 ? "erro" : "erros"}`; }

function tocar(b, o) {
  if (!inicio) { inicio = Date.now(); timer = setInterval(() => $("tempo").textContent = Math.floor((Date.now() - inicio) / 1000) + " s", 500); }
  if (o.i === prox) {
    const v = $("trilha").children[prox]; v.classList.add("cheia", "pulo");
    v.innerHTML = `<img src="${IMG[o.it.k]}" alt=""><span class="nome"></span>`; v.querySelector(".nome").textContent = o.it.n;
    b.classList.add("usado"); prox++; placar();
    $("feedback").className = "feedback ok"; $("feedback").innerHTML = "<b>Isso!</b><span></span>"; $("feedback").lastChild.textContent = o.it.n + " — faça o sinal.";
    if (prox === ITENS.length) fim();
  } else {
    erros++; placar(); b.classList.remove("balanca"); void b.offsetWidth; b.classList.add("balanca");
    $("feedback").className = "feedback nao"; $("feedback").innerHTML = "<b>Ainda não.</b><span></span>"; $("feedback").lastChild.textContent = `Esse é ${o.it.n}. Procure o ${prox + 1}º da sequência.`;
  }
}

function fim() {
  clearInterval(timer);
  const s = Math.floor((Date.now() - inicio) / 1000);
  $("festaP").textContent = `Você montou a sequência em ${s} segundos, com ${erros} ${erros === 1 ? "erro" : "erros"} e ${dicas} ${dicas === 1 ? "dica" : "dicas"}. ` + (CFG.fim || "Agora faça todos os sinais em ordem, sem olhar.");
  $("festa").hidden = false; $("festa").scrollIntoView({ behavior: "smooth", block: "center" });
}

$("instr").textContent = CFG.instr;
$("btDica").addEventListener("click", () => { if (prox >= ITENS.length) return; dicas++; $("feedback").className = "feedback"; $("feedback").textContent = `O próximo é: ${ITENS[prox].n}.`; });
$("denovo").addEventListener("click", iniciar);
iniciar();
</script>
