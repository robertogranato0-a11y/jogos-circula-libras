<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual sinal combina com a carinha? · Libras</title>
<meta name="description" content="Qual sinal combina com a carinha?: jogo da Aula 18 do Curso de Libras do Instituto Circula Libras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho; vidas e progresso; estímulo grande (cena ou categoria); 4 sinais em grade 2x2 sem texto; resultado */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --roxo-bg: #f4eef9; --amarelo: #ffcc33; --linha: #ddd3e8; --logo-bg: transparent;
  --certo: #1f8a4c; --certo-bg: #e3f4ea; --errado: #c0392b; --errado-bg: #fbe6e3;
  --mesa: #2f7a5a; --mesa-borda: #245f46;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --roxo-bg: #2c2040; --linha: #3a2c4c; --logo-bg: #ffffff;
    --certo: #5fd08f; --certo-bg: #173a27; --errado: #ff8a7a; --errado-bg: #45201b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--display); color: var(--roxo); font-size: 24px; margin: 0; line-height: 1.15; }
.instr { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.cartao { background: var(--surface); border: 1.5px solid var(--linha); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.tipo { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.msg { margin: 0; line-height: 1.5; }
.progresso { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 8px; background: var(--linha); border-radius: 99px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--roxo); transition: width .3s; }
.feedback { margin: 0; line-height: 1.45; min-height: 1.4em; }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.ok b { color: var(--certo); } .feedback.nao b { color: var(--errado); }
button.acao { font: 700 15px var(--body); padding: 12px 20px; border-radius: 999px; border: 0; background: var(--amarelo); color: #2a1740; cursor: pointer; align-self: flex-end; }
button.acao.centro { align-self: center; }
button.acao:disabled { opacity: .5; cursor: default; }
button.sec { font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; }
button.sec[aria-pressed="true"] { background: var(--roxo); color: #fff; }
button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.placar { font-family: var(--display); color: var(--roxo); font-size: clamp(44px, 12vw, 64px); line-height: 1; }
.festa { padding: 18px; border-radius: 16px; background: var(--roxo); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.festa h2 { color: var(--amarelo); }
.festa p { margin: 0; line-height: 1.5; }
.festa button.acao { align-self: flex-start; }
.sinal-img { background: #fff; border-radius: 12px; border: 1.5px solid var(--linha); display: grid; place-items: center; overflow: hidden; }
.sinal-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
@keyframes balanca { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
.balanca { animation: balanca .4s; }
@keyframes pulo { 0% { transform: scale(1) } 50% { transform: scale(1.08) } 100% { transform: scale(1) } }
.pulo { animation: pulo .35s; }
@media (prefers-reduced-motion: reduce) { .balanca, .pulo { animation: none; } }

.vidas { font-size: 20px; letter-spacing: 2px; }
.estimulo { align-self: center; width: min(320px, 86vw); min-height: 150px; border-radius: 20px; display: grid; place-items: center; text-align: center; padding: 14px; background: var(--roxo-bg); border: 3px solid var(--roxo-claro); }
.estimulo .emoji { font-size: 92px; line-height: 1.05; }
.estimulo.cor { border-color: rgba(0,0,0,.15); }
.estimulo .grupo { font: 700 clamp(26px, 7vw, 36px) var(--display); color: var(--roxo); }
.estimulo small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.pergunta { text-align: center; font-weight: 700; font-size: 18px; margin: 0; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.op { position: relative; padding: 8px; border-radius: 16px; border: 2.5px solid var(--linha); background: #fff; cursor: pointer; aspect-ratio: 1; display: grid; place-items: center; transition: transform .12s, border-color .12s; }
.op:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--roxo-claro); }
.op img { max-width: 100%; max-height: 100%; object-fit: contain; }
.op:disabled { cursor: default; }
.op.certa { border-color: var(--certo); box-shadow: 0 0 0 4px var(--certo-bg); }
.op.errada { border-color: var(--errado); box-shadow: 0 0 0 4px var(--errado-bg); }
.op .nome { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(42,23,64,.85); color: #fff; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px; text-align: center; }
.sequencia { font-weight: 700; color: var(--roxo); }
</style>
</head>

// CFG: modo ("cena" | "intruso"), instr, rodadas, vidas · cena: ITENS [{k,n,e?,c?}] · intruso: GRUPOS {nome: [{k,n}]}
const $ = id => document.getElementById(id);
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let rodadas = [], r = 0, acertos = 0, vidas = 3, seq = 0, melhor = 0, rever = [];

function montar() {
  const n = CFG.rodadas || 12;
  if (CFG.modo === "intruso") {
    const nomes = Object.keys(GRUPOS);
    return Array.from({ length: n }, () => {
      const g = nomes[Math.floor(Math.random() * nomes.length)], fora = embaralhar(nomes.filter(x => x !== g))[0];
      const tres = embaralhar(GRUPOS[g]).slice(0, 3), intruso = embaralhar(GRUPOS[fora])[0];
      return { grupo: g, certo: intruso, grupoCerto: fora, ops: embaralhar([...tres.map(it => ({ it, g })), { it: intruso, g: fora }]) };
    });
  }
  return embaralhar(ITENS).slice(0, Math.min(n, ITENS.length)).map(alvo => ({ alvo, certo: alvo, ops: embaralhar([alvo, ...embaralhar(ITENS.filter(x => x !== alvo)).slice(0, 3)].map(it => ({ it }))) }));
}

function mostrar() {
  const R = rodadas[r];
  $("num").textContent = `${r + 1} de ${rodadas.length}`;
  $("vidas").textContent = CFG.vidas ? "❤️".repeat(vidas) + "🤍".repeat(Math.max(0, CFG.vidas - vidas)) : "";
  $("seq").textContent = seq >= 2 ? `🔥 ${seq} seguidas` : "";
  $("barra").style.width = (r / rodadas.length * 100) + "%";
  $("feedback").textContent = ""; $("feedback").className = "feedback"; $("proxima").hidden = true;
  const E = $("estimulo"); E.className = "estimulo"; E.style.background = ""; E.innerHTML = "";
  if (CFG.modo === "intruso") {
    E.innerHTML = `<div><small>Grupo</small><span class="grupo"></span></div>`; E.querySelector(".grupo").textContent = R.grupo;
    $("pergunta").textContent = "Qual sinal NÃO pertence a este grupo?";
  } else {
    const a = R.alvo;
    if (a.c) { E.classList.add("cor"); E.style.background = a.c; E.setAttribute("aria-label", "Cor para adivinhar"); }
    else if (a.e) { E.innerHTML = `<span class="emoji" role="img" aria-label="Figura para adivinhar">${a.e}</span>`; }
    else { E.innerHTML = `<span class="grupo"></span>`; E.firstChild.textContent = a.n; }
    $("pergunta").textContent = CFG.pergunta || "Qual sinal combina com esta figura?";
  }
  $("ops").innerHTML = "";
  R.ops.forEach((o, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "op";
    b.innerHTML = `<img src="${IMG[o.it.k]}" alt="Opção ${i + 1}: sinal em Libras"><span class="nome" hidden></span>`;
    b.querySelector(".nome").textContent = o.it.n + (CFG.modo === "intruso" ? " · " + o.g : "");
    b.addEventListener("click", () => escolher(i));
    $("ops").appendChild(b);
  });
}

function escolher(i) {
  const R = rodadas[r], o = R.ops[i], ok = o.it === R.certo;
  if (ok) { acertos++; seq++; melhor = Math.max(melhor, seq); } else { seq = 0; if (CFG.vidas) vidas--; rever.push(R.certo.n); }
  [...$("ops").children].forEach((b, k) => { b.disabled = true; b.querySelector(".nome").hidden = false;
    if (R.ops[k].it === R.certo) b.classList.add("certa"); else if (k === i) b.classList.add("errada"); });
  $("feedback").className = "feedback " + (ok ? "ok" : "nao");
  $("feedback").innerHTML = `<b>${ok ? "Acertou!" : "Não foi dessa vez."}</b><span></span>`;
  $("feedback").lastChild.textContent = CFG.modo === "intruso"
    ? `${R.certo.n} é do grupo ${R.grupoCerto}, não de ${R.grupo}.`
    : `O sinal certo é ${R.certo.n}. Faça esse sinal com a mão.`;
  const acabou = r === rodadas.length - 1 || (CFG.vidas && vidas <= 0);
  $("proxima").textContent = acabou ? "Ver resultado →" : "Próxima →";
  $("proxima").hidden = false; $("proxima").focus();
  $("vidas").textContent = CFG.vidas ? "❤️".repeat(Math.max(0, vidas)) + "🤍".repeat(Math.max(0, CFG.vidas - Math.max(0, vidas))) : "";
}

function fim() {
  $("telaJogo").hidden = true; $("festa").hidden = false;
  const perdeu = CFG.vidas && vidas <= 0;
  $("festaT").textContent = perdeu ? "Acabaram as vidas!" : "Parabéns, você chegou ao fim!";
  $("placar").textContent = `${acertos} de ${r + 1}`;
  $("festaP").textContent = `Maior sequência de acertos: ${melhor}. ` + (rever.length ? "Revise: " + [...new Set(rever)].join(", ") + "." : "Você acertou todas!");
  window.scrollTo(0, 0);
}

function iniciar() { rodadas = montar(); r = 0; acertos = 0; vidas = CFG.vidas || 0; seq = 0; melhor = 0; rever = []; $("telaJogo").hidden = false; $("festa").hidden = true; mostrar(); }
$("instr").textContent = CFG.instr;
$("proxima").addEventListener("click", () => { if (r === rodadas.length - 1 || (CFG.vidas && vidas <= 0)) return fim(); r++; mostrar(); });
$("denovo").addEventListener("click", iniciar);
iniciar();
</script>
