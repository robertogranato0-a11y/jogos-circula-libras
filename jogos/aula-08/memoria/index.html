<style>
/* Layout: coluna central — cabeçalho, placar, grade de cartas 3 colunas no celular / 4 no computador */
:root {
  --bg: #f7f4fa; --surface: #ffffff; --ink: #2a1740; --muted: #6c6377;
  --roxo: #662d91; --roxo-claro: #8752b5; --amarelo: #ffcc33; --linha: #ddd3e8;
  --verso: #662d91; --logo-bg: transparent;
  --display: "Playfair Display", Georgia, serif;
  --body: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17101f; --surface: #221830; --ink: #f1eaf8; --muted: #b3a8c2; --roxo: #b98ae0; --linha: #3a2c4c; --logo-bg: #ffffff; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.logo { width: 160px; height: auto; margin-bottom: 10px; background: var(--logo-bg); border-radius: 10px; padding: 4px 8px; box-sizing: content-box; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); color: var(--roxo); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.1; text-wrap: balance; }
.instr { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.placar { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.placar .t { color: var(--roxo); font-size: 18px; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.carta { aspect-ratio: 3 / 4; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; font: inherit; }
.carta:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 3px; border-radius: 14px; }
.miolo { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.carta.virada .miolo, .carta.ok .miolo { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.verso { background: var(--verso); color: #fff; }
.verso .q { font-family: var(--display); font-size: clamp(40px, 12vw, 64px); line-height: 1; color: var(--amarelo); }
.verso small { margin-top: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--amarelo); font-weight: 700; }
.frente { background: #fff; border: 2px solid var(--linha); transform: rotateY(180deg); padding: 8px; gap: 4px; color: #2a1740; }
.carta.ok .frente { border-color: var(--roxo-claro); background: #fbf8ff; }
.frente img.sinal { width: 100%; height: 100%; object-fit: contain; }
.frente .nome { font-family: var(--display); color: #662d91; font-size: clamp(18px, 5vw, 26px); line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.frente .desc { font-size: clamp(12px, 3.4vw, 14px); font-weight: 600; line-height: 1.3; text-align: center; }
.rotulo { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #662d91; min-height: 14px; text-align: center; }
.carta:not(.ok) .rotulo { visibility: hidden; }
.tipo { position: absolute; top: 6px; left: 8px; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8b8296; }
.aviso { padding: 16px; border-radius: 14px; background: var(--roxo); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.aviso h2 { font-family: var(--display); margin: 0; font-size: 24px; }
.aviso p { margin: 0; line-height: 1.5; }
button.acao { font: 600 15px var(--body); padding: 12px 18px; border-radius: 10px; border: 0; background: var(--amarelo); color: #2a1740; cursor: pointer; align-self: flex-start; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--roxo); }
@media (prefers-reduced-motion: reduce) { .miolo { transition: none; } }
</style>
</head>

// CFG: instr, pares (máx. de pares por partida), tipoA/tipoB (rótulos das cartas)
// ITENS: [{k, n}] com imagem IMG[k]  ou  [{n, d}] com descrição em texto
let primeira = null, travado = false, pares = 0, jogadas = 0, inicio = 0, timer = null, sorteio = [];
const $ = id => document.getElementById(id);
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function carta(it, lado) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "carta"; b.dataset.par = it.k || it.n; b.dataset.nome = it.n; b.dataset.lado = lado;
  b.setAttribute("aria-label", "Carta virada");
  let frente;
  if (lado === "a") frente = `<span class="tipo">${CFG.tipoA || "Palavra"}</span><span class="nome"></span>`;
  else if (it.k) frente = `<span class="tipo">${CFG.tipoB || "Sinal"}</span><img class="sinal" src="${IMG[it.k]}" alt="Sinal em Libras">`;
  else frente = `<span class="tipo">${CFG.tipoB || "O que é"}</span><span class="desc"></span>`;
  b.innerHTML = `<div class="miolo"><div class="face verso"><span class="q">?</span><small>Circula Libras</small></div>` +
    `<div class="face frente">${frente}<span class="rotulo"></span></div></div>`;
  const nome = b.querySelector(".nome"); if (nome) nome.textContent = it.n;
  const desc = b.querySelector(".desc"); if (desc) desc.textContent = it.d;
  if (lado === "b") b.querySelector(".rotulo").textContent = it.n;
  b.addEventListener("click", () => virar(b));
  return b;
}

function iniciar() {
  sorteio = embaralhar(ITENS).slice(0, CFG.pares || 8);
  $("grade").replaceChildren(...embaralhar(sorteio.flatMap(it => [carta(it, "a"), carta(it, "b")])));
  primeira = null; travado = false; pares = 0; jogadas = 0; inicio = 0;
  clearInterval(timer); $("tempo").textContent = "0 s"; placar(); $("aviso").hidden = true;
}

function placar() { $("cont").textContent = `${pares} de ${sorteio.length} pares · ${jogadas} jogadas`; }

function virar(b) {
  if (travado || b.classList.contains("virada") || b.classList.contains("ok")) return;
  if (!inicio) { inicio = Date.now(); timer = setInterval(() => $("tempo").textContent = Math.floor((Date.now() - inicio) / 1000) + " s", 500); }
  b.classList.add("virada"); b.setAttribute("aria-label", "Carta aberta");
  if (!primeira) { primeira = b; return; }
  jogadas++;
  const a = primeira; primeira = null;
  if (a.dataset.par === b.dataset.par && a.dataset.lado !== b.dataset.lado) {
    [a, b].forEach(c => { c.classList.add("ok"); c.classList.remove("virada"); c.setAttribute("aria-label", c.dataset.nome + ", par encontrado"); });
    pares++; placar();
    if (pares === sorteio.length) fim();
  } else {
    placar(); travado = true;
    setTimeout(() => { [a, b].forEach(c => { c.classList.remove("virada"); c.setAttribute("aria-label", "Carta virada"); }); travado = false; }, 1100);
  }
}

function fim() {
  clearInterval(timer);
  const s = Math.floor((Date.now() - inicio) / 1000);
  $("avisoP").textContent = `Você achou os ${sorteio.length} pares em ${jogadas} jogadas e ${s} segundos. ` + (CFG.fim || "Agora faça cada sinal com a sua mão: ") + (CFG.fim ? "" : sorteio.map(x => x.n).join(", ") + ".");
  $("aviso").hidden = false;
}

$("instr").textContent = CFG.instr;
$("denovo").addEventListener("click", iniciar);
iniciar();
</script>
</body>
</html>
